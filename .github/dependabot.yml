version: 2

updates:
  # The actions in .github/workflows: one PR a week for all of them
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # pyproject.toml lists only minimum versions, so the newest release always fits and version
  # updates open a PR only when a minimum excludes it; security alerts cover these packages either way
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
